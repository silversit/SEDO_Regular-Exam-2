name: CI (Python - unittest)

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          pip install unittest-xml-reporting

      - name: Run tests (unittest)
        run: |
          mkdir -p reports
          python -m unittest discover -s . -p "test_*.py" -v | tee reports/results.txt
          python -m xmlrunner discover -s . -p "test_*.py" -o reports

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          if-no-files-found: warn
